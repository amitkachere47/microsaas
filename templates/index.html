<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunnelFlow AI - Subject Line Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>FunnelFlow AI</h1>
            <p>Personalized Subject Line Generator</p>
        </header>
        <main>
            <form id="subject-form">
                <div class="form-group">
                    <label for="customer-name">Customer Name</label>
                    <input type="text" id="customer-name" name="customer_name" placeholder="e.g., Jane Doe" required>
                </div>
                <div class="form-group">
                    <label for="pain-point">Customer's Pain Point</label>
                    <input type="text" id="pain-point" name="pain_point" placeholder="e.g., increasing user engagement" required>
                </div>
                <button type="submit">Generate Subject Line</button>
            </form>
            <div id="result" class="hidden">
                <h2>Generated Subject Line:</h2>
                <p id="subject-line"></p>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
